name: Data-verkenning (tijdelijk)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > s.py <<'PY'
          import sys,re,html,json,urllib.request,urllib.parse
          def get(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=20); return r.geturl(), r.read().decode('utf-8','replace')
              except Exception as e: return u, ""
          def text(s):
              s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>',' ',s); s=re.sub(r'<[^>]+>','\n',s); s=html.unescape(s)
              return [l.strip() for l in s.splitlines() if l.strip()]
          pat=re.compile(r'(mhz|\bfm\b|dab|kanaal\s*\d{1,2}[a-d]|\b\d{2,3}[.,]\d\b)',re.I)
          for home in sys.argv[1:]:
              u,h=get(home)
              links=set()
              for m in re.finditer(r'href="([^"]+)"',h):
                  l=m.group(1)
                  if re.search(r'rampenzender|calamiteit|frequent|ontvang|frekwins|bereik',l,re.I): links.add(urllib.parse.urljoin(u,l))
              print("=================",home,"->",sorted(links)[:8])
              for l in sorted(links)[:6]:
                  lu,lh=get(l); t=text(lh)
                  hits=[(i,x) for i,x in enumerate(t) if pat.search(x) and len(x)<200]
                  if hits: print("  ---",lu)
                  shown=set()
                  for i,x in hits[:25]:
                      for j in range(max(0,i-1),min(len(t),i+2)):
                          if j not in shown: shown.add(j); print("    ",t[j][:160])
          PY
          python3 s.py https://www.gld.nl https://www.oost.nl https://www.rtvdrenthe.nl https://www.rtvnoord.nl https://www.omropfryslan.nl https://www.omroepflevoland.nl https://www.rtvutrecht.nl https://www.nhnieuws.nl https://www.omroepwest.nl https://www.rijnmond.nl https://www.l1.nl
