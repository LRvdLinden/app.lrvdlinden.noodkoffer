name: Data-verkenning (tijdelijk)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for t in "Omroep_Gelderland" "Radio_Gelderland" "RTV_Oost" "Radio_Oost" "RTV_Drenthe" "Radio_Drenthe" "RTV_Noord" "Radio_Noord" "Omrop_Fryslân" "Omroep_Flevoland" "RTV_Utrecht" "Radio_M_Utrecht" "NH_(omroep)" "NH_Radio" "Omroep_West" "Radio_West" "RTV_Rijnmond" "Radio_Rijnmond" "Omroep_Brabant" "L1_(omroep)" "L1_Radio" "Omroep_Zeeland" "Calamiteitenzender" "Regionale_omroep_(Nederland)"; do
            echo "=================== $t"
            curl -sSL "https://nl.wikipedia.org/w/index.php?title=$t&action=raw" | grep -iE "MHz|DAB|frequent|kanaal 1[0-2][A-D]|calamit|redirect" | head -60
          done
