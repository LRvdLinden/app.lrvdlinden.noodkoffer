name: Data-verkenning (tijdelijk)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          strip() { python3 -c "import sys,re,html;s=sys.stdin.read();s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>',' ',s);s=re.sub(r'<[^>]+>','\n',s);s=html.unescape(s);print('\n'.join(l.strip() for l in s.splitlines() if l.strip()))"; }
          for u in \
            https://www.omroepgelderland.nl/frequenties https://www.gld.nl/frequenties https://www.gld.nl/radio \
            https://www.rtvoost.nl/frequenties https://www.rtvoost.nl/radio/frequenties \
            https://www.rtvdrenthe.nl/frequenties https://www.rtvdrenthe.nl/radio \
            https://www.rtvnoord.nl/frequenties https://www.rtvnoord.nl/radio \
            https://www.omropfryslan.nl/frekwinsjes https://www.omropfryslan.nl/frequenties https://www.omropfryslan.nl/radio \
            https://www.omroepflevoland.nl/frequenties https://www.omroepflevoland.nl/radio \
            https://www.rtvutrecht.nl/frequenties https://www.rtvutrecht.nl/radio \
            https://www.nhnieuws.nl/frequenties https://www.nhnieuws.nl/radio \
            https://www.omroepwest.nl/frequenties https://www.omroepwest.nl/radio \
            https://www.rijnmond.nl/frequenties https://www.rijnmond.nl/radio \
            https://www.omroepbrabant.nl/rampenzender https://www.omroepbrabant.nl/frequenties \
            https://www.l1.nl/frequenties https://l1.nl/frequenties https://www.l1nieuws.nl/frequenties \
            https://www.omroepzeeland.nl/frequenties https://www.omroepzeeland.nl/radio ; do
            echo "=================== $u"
            curl -sSL -m 20 -A "Mozilla/5.0" "$u" -o p.html -w "HTTP %{http_code} -> %{url_effective}\n" || true
            strip < p.html | grep -iE -B1 -A1 "mhz|[0-9]{2,3}[.,][0-9] ?fm|fm ?[0-9]{2,3}[.,][0-9]|dab|kanaal [0-9]{1,2}[a-d]|rampenzender|calamiteit" | head -40
          done
