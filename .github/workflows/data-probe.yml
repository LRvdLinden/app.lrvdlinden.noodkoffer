name: Data-verkenning (tijdelijk)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > s.py <<'PY'
          import sys,re,html,json,urllib.request,urllib.parse
          def get(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=20); return r.geturl(), r.read().decode('utf-8','replace')
              except Exception as e: return u, ""
          def text(s):
              s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>',' ',s); s=re.sub(r'<[^>]+>','\n',s); s=html.unescape(s)
              return [l.strip() for l in s.splitlines() if l.strip()]
          pat=re.compile(r'(mhz|\bfm\b|dab|kanaal\s*\d{1,2}[a-d]|\b\d{2,3}[.,]\d\b)',re.I)
          for home in sys.argv[1:]:
              u,h=get(home)
              links=set()
              for m in re.finditer(r'href="([^"]+)"',h):
                  l=m.group(1)
                  if re.search(r'rampenzender|calamiteit|frequent|ontvang|frekwins|bereik',l,re.I): links.add(urllib.parse.urljoin(u,l))
              print("=================",home,"->",sorted(links)[:8])
              for l in sorted(links)[:6]:
                  lu,lh=get(l); t=text(lh)
                  hits=[(i,x) for i,x in enumerate(t) if pat.search(x) and len(x)<200]
                  if hits: print("  ---",lu)
                  shown=set()
                  for i,x in hits[:25]:
                      for j in range(max(0,i-1),min(len(t),i+2)):
                          if j not in shown: shown.add(j); print("    ",t[j][:160])
          PY
          cat > d.py <<'PY2'
          import sys,re,html,urllib.request
          for u in sys.argv[1:]:
              try: h=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=20).read().decode('utf-8','replace')
              except Exception as e: print("ERR",u,e); continue
              # ook tekst uit JSON in de pagina (Next.js)
              h2=re.sub(r'\\u003c','<',h)
              s=re.sub(r'(?is)<(script|style)[^>]*>(.*?)</\1>',lambda m: ' ' if m.group(1).lower()=='style' else m.group(2),h2)
              s=re.sub(r'<[^>]+>','\n',s); s=html.unescape(s)
              t=[l.strip() for l in re.split(r'\n|\\n|","|":"',s) if l.strip()]
              print("=================",u,len(t))
              idx=[i for i,x in enumerate(t) if re.search(r'(\bFM\b|MHz|DAB|kanaal \d{1,2}[A-D]|\b(8[7-9]|9\d|10[0-8])[.,]\d\b)',x,re.I) and len(x)<300]
              seen=set()
              for i in idx[:60]:
                  for j in range(max(0,i-2),min(len(t),i+2)):
                      if j not in seen: seen.add(j); print("   ",t[j][:220])
          PY2
          python3 d.py https://www.gld.nl/hoe-ontvang-je-ons https://www.nhnieuws.nl/calamiteitenzender https://www.nhnieuws.nl/frequenties https://www.rtvutrecht.nl/meer/hoe-ontvang-je-ons https://www.omroepbrabant.nl/rampenzender https://www.l1.nl/over-l1/rampenzender https://www.omroepzeeland.nl/organisatie/frequenties https://www.omroepflevoland.nl/info/calamiteiten https://www.gld.nl/rampenzender https://www.gld.nl/calamiteitenzender
