name: Data-verkenning (tijdelijk)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > p.mjs <<'JS'
          import { chromium } from "playwright";
          const urls = process.argv.slice(2);
          const b = await chromium.launch();
          const re = /(.*NH Radio.*|Noord-Holland|Amsterdam|Alkmaar|Hilversum|Den Helder|\bFM\b|MHz|DAB|kanaal \d{1,2}[A-D]|\b0[89]00[\s-]?\d|\b0\d{2,3}[\s-]\d{2,3}|storing)/i;
          for (const u of urls) {
            const p = await b.newPage({ userAgent: "Mozilla/5.0 (Macintosh) Chrome/120" });
            try {
              await p.goto(u, { waitUntil: "networkidle", timeout: 30000 });
              for (const t of ["Akkoord", "Accepteren", "Alles accepteren", "Accept"]) { try { await p.getByRole("button", { name: t }).first().click({ timeout: 1500 }); } catch {} }
              await p.waitForTimeout(1500);
              const lines = (await p.evaluate(() => document.body.innerText)).split("\n").map((x) => x.trim()).filter(Boolean);
              console.log("=================", u, "->", p.url(), lines.length);
              const seen = new Set();
              lines.forEach((l, i) => { if (re.test(l) && l.length < 250) for (let j = Math.max(0, i - 1); j <= Math.min(lines.length - 1, i + 1); j++) if (!seen.has(j)) { seen.add(j); console.log("    " + lines[j].slice(0, 200)); } });
            } catch (e) { console.log("ERR", u, e.message.split("\n")[0]); }
            await p.close();
          }
          await b.close();
          JS
          node p.mjs https://www.pwn.nl/klantenservice https://www.pwn.nl/contact https://www.brabantwater.nl/contact https://www.oasen.nl/contact https://www.oasen.nl/klantenservice https://www.wml.nl/storingen-en-werkzaamheden https://www.wml.nl/klantenservice https://www.nhnieuws.nl/frequenties https://www.nhnieuws.nl/hoe-ontvang-je-nh https://www.rtvutrecht.nl/meer/calamiteitenzender
