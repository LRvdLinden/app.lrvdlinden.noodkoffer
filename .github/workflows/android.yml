# Bouwt de Android-app (APK) en ondertekent hem altijd met dezelfde sleutel, zodat elke update over de vorige
# versie heen installeert.
#
# - Push naar main (map android/) of met de hand: bouwt, ondertekent en publiceert meteen een release v1.0.<run>.
# - Tag vX.Y.Z (bijv. v1.1.0): idem, met dat versienummer.
# Elke release wordt de nieuwste; de site downloadt altijd die versie via
#   https://noodpakket.lrvdlinden.app/download/android/  (stuurt door naar de API, die noodpakket.apk doorgeeft)
#
# De sleutel komt uit de secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS en
# ANDROID_KEY_PASSWORD. Die zet de workflow "Android signing" in LRvdLinden/app.lrvdlinden.secrets.
# Optioneel: zet de repository-variabele ANDROID_CERT_SHA256 op de vingerafdruk uit die workflow. Dan weigert deze
# workflow elke APK die met een andere sleutel is ondertekend.
# Zonder sleutel wordt de code alleen gecompileerd (controle) en wordt er niets gepubliceerd.
name: Android

on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/android.yml]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Versie bepalen
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          # versionCode moet bij elke update hoger worden: het runnummer van deze workflow stijgt altijd.
          CODE=$(( 100 + GITHUB_RUN_NUMBER ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Versie $NAME ($CODE)"

      - name: Sleutel klaarzetten
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Geen signeersleutel gevonden. Start eerst 'Android signing' in LRvdLinden/app.lrvdlinden.secrets. Deze run compileert alleen."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            umask 077
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: APK bouwen
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Handtekening controleren
        if: steps.key.outputs.signed == 'true'
        id: verify
        env:
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$SIGNER" verify --print-certs "$APK" > certs.txt
          FP="$(grep -m1 'SHA-256 digest' certs.txt | sed 's/.*: //' | tr 'a-f' 'A-F')"
          rm -f certs.txt
          echo "::notice::Ondertekend met certificaat SHA-256 $FP"
          if [ -n "$EXPECTED" ]; then
            WANT="$(printf '%s' "$EXPECTED" | tr -d ': ' | tr 'a-f' 'A-F')"
            if [ "$FP" != "$WANT" ]; then
              echo "::error::Deze APK is met een ANDERE sleutel ondertekend dan ANDROID_CERT_SHA256. Hij zou niet over de vorige versie installeren."
              exit 1
            fi
          fi
          mkdir -p dist
          cp "$APK" "dist/noodpakket-${{ steps.version.outputs.name }}.apk"
          cp "$APK" dist/noodpakket.apk

      - name: Sleutel opruimen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: noodpakket-${{ steps.version.outputs.name }}
          path: android/dist/noodpakket-${{ steps.version.outputs.name }}.apk

      - name: Release publiceren
        if: steps.key.outputs.signed == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Noodpakket ${{ steps.version.outputs.name }}
          body: |
            Android-versie van Noodpakket. Installeer `noodpakket.apk`; een update installeert over de vorige versie heen.
            Download: https://noodpakket.lrvdlinden.app/download/android/ · Meer info: https://noodpakket.lrvdlinden.app/support/
          files: |
            android/dist/noodpakket.apk
            android/dist/noodpakket-${{ steps.version.outputs.name }}.apk
