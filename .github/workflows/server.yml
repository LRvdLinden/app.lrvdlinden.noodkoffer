name: Server

# Test en deploy van de Noodpakket-API (Cloudflare Worker + D1) in server/: accounts, gezinnen en synchronisatie.
# Nodig (repo-secrets): CLOUDFLARE_API_TOKEN (Workers Scripts: Edit + D1: Edit), CLOUDFLARE_ACCOUNT_ID en
# SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD / SMTP_FROM voor de mails.
# BEHEER_USER / BEHEER_PASSWORD (beheer-inlog) zet de workflow "Beheer-inlog verdelen" in app.lrvdlinden.secrets.
# ADMIN_SECRET (ondertekent beheertokens) maakt deze workflow zelf, eenmalig, rechtstreeks in de Worker.
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**"]
  workflow_dispatch:
    inputs:
      mailtest:
        description: "Na de deploy een testmail naar het afzenderadres (SMTP_FROM) sturen"
        type: boolean
        default: false

concurrency:
  group: server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test

      - name: Cloudflare-secrets aanwezig?
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID ontbreken – alleen getest, niet gedeployd."; fi

      - name: D1-database (aanmaken als hij nog niet bestaat)
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          find_id() { npx wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const i=s.indexOf("[");const d=JSON.parse(s.slice(i)).find(x=>x.name==="noodpakket");console.log(d?d.uuid:"")}catch{console.log("")}})'; }
          if ! npx wrangler d1 list > /dev/null 2>&1; then
            echo "::error::Het Cloudflare-token mag geen D1-databases beheren. Voeg bij het token de permissie Account → D1 → Edit toe (en controleer CLOUDFLARE_ACCOUNT_ID)."
            exit 1
          fi
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create noodpakket --location weur
            ID=$(find_id)
          fi
          [ -n "$ID" ] || { echo "::error::D1-database niet gevonden of aangemaakt"; exit 1; }
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml
          npx wrangler d1 execute noodpakket --remote --file schema.sql

      - name: workers.dev-subdomein (eenmalig)
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          CUR=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result?.subdomain||"")}catch{console.log("")}})')
          if [ -n "$CUR" ]; then echo "Subdomein: $CUR.workers.dev"; exit 0; fi
          for NAME in ${{ vars.WORKERS_SUBDOMAIN || 'lrvdlinden' }} lrvdlinden-apps noodpakket noodpakket-app; do
            R=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" -d "{\"subdomain\":\"$NAME\"}" "$API")
            if echo "$R" | grep -qE '"success": *true'; then echo "Subdomein geregistreerd: $NAME.workers.dev"; exit 0; fi
            echo "$NAME niet beschikbaar: $R"
          done
          echo "::error::Kon geen workers.dev-subdomein registreren. Kies er zelf een in Cloudflare (Workers & Pages → je subdomein)."
          exit 1

      - name: Deploy
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log

      - name: Secrets naar de Worker
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          BEHEER_USER: ${{ secrets.BEHEER_USER }}
          BEHEER_PASSWORD: ${{ secrets.BEHEER_PASSWORD }}
        run: |
          HAS_ADMIN=$(npx wrangler secret list 2>/dev/null | grep -c 'ADMIN_SECRET' || true)
          HAS_ADMIN="$HAS_ADMIN" node -e '
            const keys = ["SMTP_HOST","SMTP_PORT","SMTP_USER","SMTP_PASSWORD","SMTP_FROM","BEHEER_USER","BEHEER_PASSWORD"];
            const out = {}; for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            if (process.env.HAS_ADMIN === "0") out.ADMIN_SECRET = require("crypto").randomBytes(32).toString("base64url");
            require("fs").writeFileSync("secrets.json", JSON.stringify(out), { mode: 0o600 });
            console.log("Secrets:", Object.keys(out).join(", "));
            for (const k of ["SMTP_HOST","SMTP_USER","SMTP_PASSWORD"]) if (!out[k]) console.log("::warning::" + k + " ontbreekt: er gaan geen mails uit");
            if (!out.BEHEER_USER) console.log("::warning::BEHEER_USER/BEHEER_PASSWORD ontbreken: start Beheer-inlog verdelen in app.lrvdlinden.secrets");'
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      - name: Controle en adres van de API
        if: steps.cf.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "API: $URL"
          for i in 1 2 3 4 5 6; do
            H=$(curl -s "$URL/health" || true)
            echo "$H" | grep -q '"ok":true' && break
            sleep 5
          done
          echo "health: $H"
          echo "$H" | grep -q '"ok":true' || { echo "::error::$URL/health antwoordt niet"; exit 1; }
          S=$(curl -s -o /dev/null -w '%{http_code}' "$URL/me")
          L=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"email":"niemand@example.com","password":"Onjuist123"}' "$URL/auth/login")
          echo "zonder inlog /me: $S (verwacht 401), onjuiste inlog: $L (verwacht 401)"
          {
            echo "### API: $URL"
            echo "- health: \`$H\`"
            echo "- /me zonder inlog: $S · onjuiste inlog: $L"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Testmail
        if: steps.cf.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.mailtest
        env:
          BEHEER_USER: ${{ secrets.BEHEER_USER }}
          BEHEER_PASSWORD: ${{ secrets.BEHEER_PASSWORD }}
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          TOKEN=$(node -e 'fetch(process.argv[1] + "/admin/login", {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({user:process.env.BEHEER_USER,password:process.env.BEHEER_PASSWORD})}).then(r=>r.json()).then(j=>console.log(j.token||""))' "$URL")
          [ -n "$TOKEN" ] || { echo "::error::Inloggen op /admin mislukt"; exit 1; }
          echo "::add-mask::$TOKEN"
          R=$(curl -s -X POST -H "authorization: Bearer $TOKEN" "$URL/admin/mailtest")
          echo "Testmail: $R"
          echo "- testmail: \`$R\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$R" | grep -q '"ok":true' || { echo "::error::Testmail mislukt; controleer SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASSWORD en kijk in de Worker-logs (wrangler tail)"; exit 1; }
