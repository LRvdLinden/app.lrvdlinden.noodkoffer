name: Noodkoffer
options:
  bundleIdPrefix: app.lrvdlinden
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: EU3UY476T6
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Noodkoffer:
    type: application
    platform: iOS
    sources:
      - path: Noodkoffer
      - path: Shared
    entitlements:
      path: Noodkoffer/Noodkoffer.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.app.lrvdlinden.noodkoffer]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.app.lrvdlinden.noodkoffer]
        aps-environment: development
    info:
      path: Noodkoffer/Info.plist
      properties:
        CFBundleDisplayName: Noodkoffer
        LSApplicationCategoryType: public.app-category.lifestyle
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: app.lrvdlinden.noodkoffer
            CFBundleURLSchemes: [noodkoffer]
        NSCameraUsageDescription: Noodkoffer uses the camera to read expiry dates from packaging.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lrvdlinden.noodkoffer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Noodkoffer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    dependencies:
      - target: NoodkofferWidget
  NoodkofferWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NoodkofferWidget
      - path: Shared
    entitlements:
      path: NoodkofferWidget/NoodkofferWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.app.lrvdlinden.noodkoffer]
    info:
      path: NoodkofferWidget/Info.plist
      properties:
        CFBundleDisplayName: Noodkoffer
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lrvdlinden.noodkoffer.widget
        INFOPLIST_KEY_CFBundleDisplayName: Noodkoffer
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
schemes:
  Noodkoffer:
    build:
      targets:
        Noodkoffer: all
        NoodkofferWidget: all
    run:
      config: Debug
