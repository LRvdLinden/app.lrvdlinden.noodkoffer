<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Noodpakket – app-schermen</title>
<style>
  /* Visual mockups of the iOS screens (same content, colours and layout as the SwiftUI code). */
  :root { --g: #1B9A5E; --gd: #0F7A4A; --amber: #C77A00; --red: #D33A3F; --bg: #F2F2F7; --card: #fff; --ink: #000; --mut: #8A8A8E; --sep: #E5E5EA; }
  .dark { --g: #3CCB86; --gd: #2FB673; --amber: #F5B731; --red: #FF6B6F; --bg: #000; --card: #1C1C1E; --ink: #fff; --mut: #8D8D93; --sep: #38383A; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "SF Pro Text", Inter, "Helvetica Neue", Arial, sans-serif; }
  .phone { width: 390px; height: 844px; background: var(--bg); color: var(--ink); position: relative; overflow: hidden; }
  .status { height: 54px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 8px 36px; font-weight: 600; font-size: 16px; }
  .status i { font-style: normal; letter-spacing: 2px; font-size: 12px; }
  .nav { padding: 6px 16px 10px; display: flex; justify-content: space-between; align-items: flex-end; }
  .nav h1 { font-size: 34px; margin: 0; font-weight: 700; letter-spacing: .3px; }
  .plus { color: var(--g); font-size: 30px; font-weight: 300; line-height: 1; }
  .search { margin: 0 16px 14px; background: rgba(118,118,128,.12); border-radius: 10px; height: 36px; display: flex; align-items: center; padding: 0 10px; color: var(--mut); font-size: 17px; gap: 6px; }
  .hdr { margin: 0 16px 18px; background: var(--card); border-radius: 22px; padding: 18px; display: flex; gap: 20px; align-items: center; }
  .ring { width: 112px; height: 112px; position: relative; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .lbl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring b { font-size: 28px; } .ring span { font-size: 12px; color: var(--mut); }
  .hdr h3 { margin: 0 0 6px; font-size: 17px; } .hdr p { margin: 0 0 6px; color: var(--mut); font-size: 15px; }
  .hdr .warn { color: var(--amber); font-size: 15px; }
  .sec { margin: 0 16px; } .sec h4 { margin: 0 0 6px 16px; font-size: 13px; font-weight: 500; color: var(--mut); text-transform: uppercase; display: flex; gap: 6px; align-items: center; }
  .group { background: var(--card); border-radius: 12px; margin-bottom: 22px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; position: relative; min-height: 44px; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 56px; right: 0; border-top: .5px solid var(--sep); }
  .plain .row + .row::before { left: 16px; }
  .ico { width: 26px; height: 26px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; }
  .have { background: var(--g); color: #fff; font-size: 15px; font-weight: 700; }
  .part { border: 2.5px solid var(--amber); background: linear-gradient(90deg, var(--amber) 50%, transparent 50%); }
  .miss { border: 2px solid #C7C7CC; }
  .name { font-size: 17px; font-weight: 500; } .sub { font-size: 13px; color: var(--mut); margin-top: 1px; }
  .grow { flex: 1; min-width: 0; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
  .b-g { color: var(--g); background: color-mix(in srgb, var(--g) 14%, transparent); }
  .b-a { color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, transparent); }
  .b-r { color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }
  .tabs { position: absolute; bottom: 0; left: 0; right: 0; height: 83px; background: color-mix(in srgb, var(--card) 92%, transparent); border-top: .5px solid var(--sep); display: flex; justify-content: space-around; padding-top: 7px; backdrop-filter: blur(20px); }
  .tab { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--mut); gap: 3px; width: 74px; }
  .tab.on { color: var(--g); } .tab svg { width: 26px; height: 24px; }
  .catico { width: 28px; color: var(--g); text-align: center; font-size: 16px; }
  .field { padding: 12px 16px; font-size: 17px; } .ph { color: var(--mut); }
  .cap { font-size: 13px; color: var(--mut); margin: -16px 16px 22px 32px; line-height: 1.35; }
  .btnrow { color: var(--g); font-size: 17px; }
  .more { margin: 0 0 22px; background: var(--card); border: 1px solid var(--sep); border-radius: 22px; padding: 16px; display: flex; gap: 14px; align-items: center; }
  .more .t { color: #2747E8; font-weight: 600; font-size: 17px; } .dark .more .t { color: #8A9DFF; }
  .more .s { color: var(--mut); font-size: 15px; }
  .pill { background: #2747E8; color: #fff; font-weight: 700; font-size: 15px; padding: 6px 14px; border-radius: 99px; } .dark .pill { background: #8A9DFF; color: #0D1018; }
  .foot { text-align: center; color: var(--mut); font-size: 15px; padding: 6px 0 24px; } .foot img, .foot svg { display: block; margin: 0 auto 14px; border-radius: 14px; }
  .toggle { width: 51px; height: 31px; border-radius: 99px; background: var(--g); position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; right: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
  .val { color: var(--mut); font-size: 17px; }
  .chev { color: #C4C4C7; font-size: 20px; }
  .stepper { display: flex; border-radius: 8px; background: rgba(118,118,128,.12); font-size: 20px; } .stepper span { width: 47px; text-align: center; padding: 2px 0; } .stepper span + span { border-left: 1px solid var(--sep); }
  .ok { color: var(--g); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const p = new URLSearchParams(location.search);
const screen = p.get('s') || 'kit';
if (p.get('dark') === '1') document.body.classList.add('dark');

const shield = (s, fg = '#0F7A4A', bg = '#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 1024 1024"><path d="M512 196l280 100v220c0 170-118 290-280 340-162-50-280-170-280-340V296z" fill="${bg}"/><path d="M372 432h120l-86 210" fill="none" stroke="${fg}" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/><path d="M548 470a50 50 0 0 1 100 0c0 50-100 100-110 172h120" fill="none" stroke="${fg}" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const appIcon = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 1024 1024" style="border-radius:${s*0.2237}px"><defs><linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2FB673"/><stop offset="1" stop-color="#0F7A4A"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#ai)"/><g>${shield(1024).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g></svg>`;

const icons = {
  kit: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z"/></svg>',
  exp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4h6v3H9zM8 12h8M8 16h6"/></svg>',
  set: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
  shop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/></svg>',
};
const tabs = (on) => `<div class="tabs">${[['kit','Pakket'],['exp','Houdbaar'],['shop','Boodschappen'],['plan','Noodplan'],['set','Instellingen']].map(([k,l]) => `<div class="tab ${k===on?'on':''}">${icons[k]}${l}</div>`).join('')}</div>`;
const status = `<div class="status"><span>9:41</span><i>●●●● ▮</i></div>`;
const ring = (pct, color) => `<div class="ring"><svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="49" fill="none" stroke="rgba(120,120,128,.16)" stroke-width="14"/><circle cx="56" cy="56" r="49" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(2*Math.PI*49).toFixed(1)}" stroke-dashoffset="${(2*Math.PI*49*(1-pct/100)).toFixed(1)}"/></svg><div class="lbl"><b>${pct}%</b><span>compleet</span></div></div>`;
const item = (st, name, sub, badge) => `<div class="row"><div class="ico ${st}">${st==='have'?'✓':''}</div><div class="grow"><div class="name">${name}</div><div class="sub">${sub}</div></div>${badge||''}</div>`;
const B = (cls, t) => `<span class="badge ${cls}">${t}</span>`;

const screens = {
  shop: () => `${status}<div class="nav"><h1>Boodschappen</h1><span class="plus" style="font-size:22px">⤴︎</span></div>
    <div class="sec"><div class="group">
      ${['Batterijen|Nog nodig: 1 pakken','Houdbaar eten|Nog nodig: 3 dagen','Noodradio|Nog nodig: 1 st.','Contant geld|Nog nodig: € 70','Kaarsen en lucifers|Nog nodig: 1 pakken'].map(x=>{const [n,t]=x.split('|');return `<div class="row"><div class="ico miss"></div><div class="grow"><div class="name">${n}</div><div class="sub">${t}</div></div></div>`}).join('')}
    </div><div class="cap" style="margin-top:-14px">Vink een item af als je het gekocht hebt: het gaat dan je pakket in.</div></div>${tabs('shop')}`,

  scan: () => `${status}<div class="nav" style="justify-content:center"><h1 style="font-size:17px">Scan barcode</h1></div>
    <div class="sec">
      <div class="group"><div class="row" style="gap:14px;padding:14px 16px">
        <div style="width:64px;height:64px;border-radius:12px;background:linear-gradient(160deg,#E3F1FF,#BFDDFB);display:grid;place-items:center;font-size:30px">💧</div>
        <div class="grow"><div class="name" style="font-weight:600">Natuurlijk mineraalwater 6 × 1,5 L</div><div class="sub">Huismerk · 8712345678906</div></div></div></div>
      <div class="cap" style="margin-top:-16px">Productgegevens: Open Food Facts (ODbL)</div>
      <h4>Toevoegen aan</h4><div class="group plain">
        <div class="row"><span class="grow name" style="font-weight:400">Item</span><span class="val" style="color:var(--g)">Drinkwater ⌄</span></div>
        <div class="row"><span class="grow name" style="font-weight:400">Hoeveelheid</span><span class="val">9 L</span><div class="stepper"><span>−</span><span>+</span></div></div>
        <div class="row"><span class="grow name" style="font-weight:400">Na toevoegen</span><span class="val">27 L / 27 L</span></div>
      </div>
      <h4>Houdbaarheidsdatum</h4><div class="group plain">
        <div class="row"><span class="grow name" style="font-weight:400">Heeft een houdbaarheidsdatum</span><div class="toggle"></div></div>
        <div class="row"><span class="grow name" style="font-weight:400">Verloopt op</span><span class="badge" style="background:rgba(118,118,128,.12);font-size:17px;font-weight:400;padding:6px 11px;border-radius:8px">14 jan 2028</span></div>
        <div class="row btnrow">⌗ Scan datum van verpakking</div>
      </div>
      <div style="margin:4px 0;background:var(--g);color:#fff;text-align:center;font-weight:600;font-size:17px;padding:14px;border-radius:14px">Voeg toe</div>
    </div>`,

  kit: () => `${status}<div class="nav"><h1>Noodpakket</h1><span class="plus" style="display:flex;gap:18px;align-items:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>+</span></div>
    <div class="search">⌕ Zoek in het pakket</div>
    <div class="hdr">${ring(85, 'var(--amber)')}<div><h3>Bijna zover</h3><p>13 items voor 3 personen</p><div class="warn">📅 Batterijen over 23 dagen</div></div></div>
    <div class="sec"><h4>💧 Water en eten</h4><div class="group">
      ${item('have','Drinkwater','27 L / 27 L', B('b-g','412 dagen'))}
      ${item('part','Houdbaar eten','6 dagen / 9 dagen', B('b-g','188 dagen'))}
    </div>
    <h4>✚ Gezondheid</h4><div class="group">
      ${item('have','Medicijnen','1 pakken / 1 pakken', B('b-a','27 dagen'))}
      ${item('have','EHBO-doos','1 st. / 1 st.', B('b-g','741 dagen'))}
    </div>
    <h4>🔦 Licht en stroom</h4><div class="group">
      ${item('have','Zaklamp','1 st. / 1 st.')}
      ${item('part','Batterijen','1 pakken / 2 pakken', B('b-a','23 dagen'))}
      ${item('have','Powerbank','1 st. / 1 st.')}
    </div>
    <h4>📻 Informatie</h4><div class="group">${item('miss','Noodradio','0 st. / 1 st.')}</div>
    <h4>📄 Geld en documenten</h4><div class="group">${item('part','Contant geld','€ 100 / € 170')}${item('have','Kopie van ID-bewijzen','1 st. / 1 st.')}</div>
    <h4>🔥 Warmte en beschutting</h4><div class="group">${item('have','Dekens en warme kleding','3 st. / 3 st.')}</div>
    <h4>🧼 Hygiëne</h4><div class="group">${item('have','Wc-papier en vuilniszakken','1 pakken / 1 pakken')}</div>
    </div>${tabs('kit')}`,

  exp: () => `${status}<div class="nav"><h1>Houdbaarheid</h1></div>
    <div class="sec"><h4>Verlopen</h4><div class="group">
      <div class="row"><span class="catico">✚</span><div class="grow"><div class="name">Pleisters</div><div class="sub">2 november 2026</div></div>${B('b-r','Verlopen')}</div>
    </div>
    <h4>Binnen 30 dagen</h4><div class="group">
      <div class="row"><span class="catico">🔦</span><div class="grow"><div class="name">Batterijen</div><div class="sub">4 december 2026</div></div>${B('b-a','23 dagen')}</div>
      <div class="row"><span class="catico">✚</span><div class="grow"><div class="name">Medicijnen</div><div class="sub">8 december 2026</div></div>${B('b-a','27 dagen')}</div>
    </div>
    <h4>Later</h4><div class="group">
      <div class="row"><span class="catico">💧</span><div class="grow"><div class="name">Houdbaar eten</div><div class="sub">18 mei 2027</div></div>${B('b-g','188 dagen')}</div>
      <div class="row"><span class="catico">🐾</span><div class="grow"><div class="name">Dierenvoer</div><div class="sub">1 augustus 2027</div></div>${B('b-g','263 dagen')}</div>
      <div class="row"><span class="catico">💧</span><div class="grow"><div class="name">Drinkwater</div><div class="sub">28 december 2027</div></div>${B('b-g','412 dagen')}</div>
    </div></div>${tabs('exp')}`,

  plan: () => `${status}<div class="nav"><h1>Noodplan</h1></div>
    <div class="sec"><h4>Wat te doen bij…</h4><div class="group">
      <div class="row"><span class="catico">⚠︎</span><span class="grow name" style="font-weight:400">NL-Alert of sirene</span><span class="chev">›</span></div>
      <div class="row"><span class="catico">⚡︎</span><span class="grow name" style="font-weight:400">Stroomuitval</span><span class="chev">›</span></div>
      <div class="row"><span class="catico">💧</span><span class="grow name" style="font-weight:400">Geen kraanwater</span><span class="chev">›</span></div>
    </div>
    <div class="group plain"><div class="field" style="font-size:15px;color:var(--mut)">Spreek dit samen af en bewaar een geprinte versie bij je noodpakket. In een noodsituatie werkt je telefoon misschien niet.</div></div>
    <h4>Verzamelpunt</h4><div class="group plain"><div class="field">Bij de buren op nummer 12, anders het buurthuis</div></div>
    <h4>Contacten</h4><div class="group plain"><div class="field">Sanne 06-12345678<br>Opa en oma 055-1234567</div></div>
    <h4>Afspraken</h4><div class="group plain"><div class="field">Papa haalt de kinderen op school</div></div>
    <h4>Water, gas en stroom</h4><div class="group plain"><div class="field">Hoofdkraan en meterkast in de gang</div></div>
    <h4>Checkmoment</h4><div class="group plain"><div class="row"><div class="grow name" style="font-weight:400">Volgende check</div><span class="badge" style="background:rgba(118,118,128,.12);font-size:17px;font-weight:400;padding:6px 11px;border-radius:8px">11 mei 2027</span></div></div>
    <div class="group plain"><div class="row btnrow">🖨  Maak PDF</div></div></div>${tabs('plan')}`,

  set: () => `${status}<div class="nav"><h1>Instellingen</h1></div>
    <div class="sec"><h4>Huishouden</h4><div class="group plain">
      <div class="row"><span class="grow name" style="font-weight:400">Volwassenen</span><span class="val">2</span><div class="stepper"><span>−</span><span>+</span></div></div>
      <div class="row"><span class="grow name" style="font-weight:400">Kinderen</span><span class="val">1</span><div class="stepper"><span>−</span><span>+</span></div></div>
      <div class="row"><span class="grow name" style="font-weight:400">Dagen voorraad</span><span class="val">3</span><div class="stepper"><span>−</span><span>+</span></div></div>
    </div>
    <h4>Herinneringen</h4><div class="group plain">
      <div class="row"><span class="grow name" style="font-weight:400">Houdbaarheidsherinneringen</span><div class="toggle"></div></div>
    </div>
    <h4>Ontdekken</h4>
    <div class="more"><svg width="56" height="56" viewBox="0 0 512 512" style="border-radius:13px;flex:none"><rect width="512" height="512" rx="116" fill="#121726"/><path d="M132 146v224h100M292 370V146h48a62 62 0 0 1 0 124h-48M338 270l52 100" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/><circle cx="404" cy="126" r="34" fill="#4C6BFF" stroke="#121726" stroke-width="14"/></svg>
      <div class="grow"><div class="t">Meer apps van de ontwikkelaar</div><div class="s">Apps voor iPhone, iPad, Apple TV en Homey</div></div><span class="pill">Bekijk</span></div>
    <div class="foot">${appIcon(64)}Versie: 1.0.0 (1)<br>© 2026 Noodpakket</div></div>${tabs('set')}`,

};
document.getElementById('root').innerHTML = `<div class="phone">${screens[screen]()}</div>`;
// Optional size (iPad) and English text, so the same screens can be used for every App Store set.
const W = +p.get('w'), H = +p.get('h');
if (W && H) { const ph = document.querySelector('.phone'); ph.style.width = W + 'px'; ph.style.height = H + 'px'; }
if (p.get('lang') === 'en') {
  document.documentElement.lang = 'en';
  const EN = {
    'Noodpakket': 'Emergency kit', 'Zoek in het pakket': 'Search the kit', 'Bijna zover': 'Keep going', 'compleet': 'complete',
    '13 items voor 3 personen': '13 items for 3 people', 'Batterijen over 23 dagen': 'Batteries in 23 days',
    'Water en eten': 'Water and food', 'Gezondheid': 'Health', 'Licht en stroom': 'Light and power',
    'Drinkwater': 'Drinking water', 'Houdbaar eten': 'Long-life food', 'Medicijnen': 'Medicines', 'EHBO-doos': 'First aid kit',
    'Zaklamp': 'Torch', 'Batterijen': 'Batteries', 'Pleisters': 'Plasters', 'Dierenvoer': 'Pet food', 'Noodradio': 'Emergency radio',
    'Contant geld': 'Cash', 'Kaarsen en lucifers': 'Candles and matches',
    'Pakket': 'Kit', 'Houdbaar': 'Expiry', 'Boodschappen': 'Shopping', 'Noodplan': 'Plan', 'Instellingen': 'Settings',
    'Houdbaarheid': 'Expiry dates', 'Verlopen': 'Expired', 'Binnen 30 dagen': 'Within 30 days', 'Later': 'Later',
    'Nog nodig: 1 pakken': 'Still needed: 1 packs', 'Nog nodig: 3 dagen': 'Still needed: 3 days', 'Nog nodig: 1 st.': 'Still needed: 1 pcs',
    'Nog nodig: € 70': 'Still needed: €70',
    'Vink een item af als je het gekocht hebt: het gaat dan je pakket in.': 'Tick an item when you have bought it: it moves into your kit.',
    'Scan barcode': 'Scan barcode', 'Natuurlijk mineraalwater 6 × 1,5 L': 'Natural mineral water 6 × 1.5 L', 'Huismerk · 8712345678906': 'Store brand · 8712345678906',
    'Productgegevens: Open Food Facts (ODbL)': 'Product data: Open Food Facts (ODbL)', 'Toevoegen aan': 'Add to', 'Item': 'Item',
    'Drinkwater ⌄': 'Drinking water ⌄', 'Hoeveelheid': 'Amount', 'Na toevoegen': 'After adding', 'Houdbaarheidsdatum': 'Expiry date',
    'Heeft een houdbaarheidsdatum': 'Has an expiry date', 'Verloopt op': 'Expires on', '14 jan 2028': 'Jan 14, 2028',
    '⌗ Scan datum van verpakking': '⌗ Scan date from packaging', 'Voeg toe': 'Add',
    'Wat te doen bij…': 'What to do when…', 'NL-Alert of sirene': 'NL-Alert or siren', 'Stroomuitval': 'Power cut', 'Geen kraanwater': 'No tap water',
    'Spreek dit samen af en bewaar een geprinte versie bij je noodpakket. In een noodsituatie werkt je telefoon misschien niet.':
      'Agree on this together and keep a printed copy with your kit. Phones may not work during an emergency.',
    'Verzamelpunt': 'Meeting point', 'Bij de buren op nummer 12, anders het buurthuis': 'The neighbours at number 12, otherwise the community centre',
    'Contacten': 'Contacts', 'Opa en oma 055-1234567': 'Grandma and grandpa 055-1234567', 'Afspraken': 'Arrangements',
    'Papa haalt de kinderen op school': 'Dad picks up the children from school', 'Water, gas en stroom': 'Water, gas and electricity',
    'Hoofdkraan en meterkast in de gang': 'Main tap and fuse box in the hall', 'Checkmoment': 'Kit check', 'Volgende check': 'Next check',
    '11 mei 2027': 'May 11, 2027', '🖨  Maak PDF': '🖨  Create PDF', 'Huishouden': 'Household', 'Volwassenen': 'Adults', 'Kinderen': 'Children',
    'Dagen voorraad': 'Days of supplies', 'Herinneringen': 'Reminders', 'Houdbaarheidsherinneringen': 'Expiry reminders', 'Ontdekken': 'Discover',
    'Meer apps van de ontwikkelaar': 'More apps from the developer', 'Apps voor iPhone, iPad, Apple TV en Homey': 'Apps for iPhone, iPad, Apple TV and Homey',
    'Bekijk': 'View', 'Versie: 1.0.0 (1)': 'Version: 1.0.0 (1)', 'Informatie': 'Information', 'Geld en documenten': 'Money and documents', 'Kopie van ID-bewijzen': 'Copies of ID documents', 'Warmte en beschutting': 'Warmth and shelter', 'Dekens en warme kleding': 'Blankets and warm clothes', 'Hygiëne': 'Hygiene', 'Wc-papier en vuilniszakken': 'Toilet paper and bin bags', 'Powerbank': 'Power bank', 'Batterijen over 23 dagen': 'Batteries in 23 days',
  };
  const units = [[/ dagen\b/g, ' days'], [/ pakken\b/g, ' packs'], [/ st\./g, ' pcs'], [/^(\d+) mei (\d{4})$/, 'May $1, $2'],
    [/^(\d+) november (\d{4})$/, 'November $1, $2'], [/^(\d+) december (\d{4})$/, 'December $1, $2'],
    [/^(\d+) augustus (\d{4})$/, 'August $1, $2'], [/^(\d+) januari (\d{4})$/, 'January $1, $2']];
  const KEYS = Object.keys(EN).sort((x, y) => y.length - x.length);
  const walker = document.createTreeWalker(document.getElementById('root'), NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const t = n.nodeValue.trim(); if (!t) return;
    if (EN[t] !== undefined) { n.nodeValue = n.nodeValue.replace(t, EN[t]); return; }
    let v = t;
    // Text that also contains an emoji or symbol: translate the longest known phrase inside it.
    const hit = KEYS.find(k => k.length > 4 && v.includes(k));
    if (hit) v = v.replace(hit, EN[hit]);
    units.forEach(([re, to]) => { v = v.replace(re, to); });
    if (v !== t) n.nodeValue = n.nodeValue.replace(t, v);
  });
}
