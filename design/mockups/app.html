<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Noodpakket – app-schermen</title>
<script src="../illustrations/illustrations.js"></script>
<style>
  /* Visual mockups of the app screens: same content, colours and layout as the SwiftUI/Compose code.
     ?s=kit|exp|shop|scan|plan|set  ?lang=en  ?dark=1  ?w=&h= (iPad) */
  :root { --purple: #3C175B; --deep: #2E0F47; --accent: #5A2E85; --yellow: #F4B943; --cream: #FCF2DB; --canvas: #F2F5F9; --card: #fff;
          --ink: #1E1428; --mut: #7A6E86; --ok: #1B9A5E; --warn: #B86E00; --bad: #C8372F; --sep: #E7E3EC; }
  .dark { --purple: #2A0E42; --deep: #1C0830; --accent: #C9A6F0; --cream: #2B2233; --canvas: #121016; --card: #1E1A24;
          --ink: #F2EEF6; --mut: #A79DB3; --ok: #3CCB86; --warn: #F5B731; --bad: #FF6B6F; --sep: #2E2836; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "SF Pro Text", Inter, "Helvetica Neue", Arial, sans-serif; }
  .phone { width: 390px; height: 844px; position: relative; overflow: hidden; color: var(--ink);
           background: linear-gradient(var(--purple), var(--deep) 520px, var(--canvas) 520px); }
  .status { height: 54px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 8px 36px; font-weight: 600; font-size: 16px; color: #fff; }
  .status i { font-style: normal; letter-spacing: 2px; font-size: 12px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .hero { position: relative; padding: 8px 20px 34px; color: #fff; min-height: 150px; }
  .hero h1 { font: 800 34px/1.1 ui-rounded, "SF Pro Rounded", Inter, sans-serif; letter-spacing: -.01em; }
  .hero .top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; }
  .hero .subt { opacity: .75; font-size: 15px; margin-top: 4px; position: relative; z-index: 2; }
  .hbtns { display: flex; gap: 10px; }
  .hbtn { width: 40px; height: 40px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center; }
  .hbtn svg { width: 20px; height: 20px; stroke: #3C175B; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .art { position: absolute; right: 12px; top: 64px; width: 170px; height: 200px; pointer-events: none; }
  .hero.has-art { min-height: 290px; }
  .art svg { position: absolute; }
  .num { font: 800 60px/1 ui-rounded, "SF Pro Rounded", Inter, sans-serif; color: var(--yellow); margin-top: 14px; position: relative; z-index: 2; }
  .meterbar { width: 190px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.16); margin-top: 10px; overflow: hidden; }
  .meterbar i { display: block; height: 100%; background: var(--yellow); border-radius: 5px; }
  .togo { margin-top: 10px; font-size: 15px; font-weight: 500; opacity: .85; }
  .stats { display: flex; gap: 10px; margin-top: 18px; position: relative; z-index: 2; }
  .stats div { flex: 1; background: rgba(255,255,255,.1); border-radius: 14px; padding: 10px; }
  .stats b { display: block; font: 800 28px ui-rounded, Inter, sans-serif; } .stats small { font-size: 11px; font-weight: 600; opacity: .75; }
  .sheet { background: var(--canvas); border-radius: 30px 30px 0 0; padding: 18px 16px 120px; min-height: 900px; }
  .alert { display: flex; gap: 12px; align-items: center; background: var(--yellow); color: #3C175B; border-radius: 18px; padding: 12px; font-weight: 700; font-size: 15px; margin-bottom: 12px; }
  .alert .chev { margin-left: auto; font-weight: 800; }
  .search { display: flex; gap: 8px; align-items: center; background: var(--card); border-radius: 14px; padding: 10px 12px; color: var(--mut); font-size: 17px; }
  .st { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); padding: 14px 4px 8px; }
  .row { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 18px; padding: 8px 14px 8px 8px; margin-bottom: 8px; }
  .tile { flex: none; display: grid; place-items: center; }
  .tile svg { width: 88%; height: 88%; }
  .grow { flex: 1; min-width: 0; }
  .name { font-size: 17px; font-weight: 600; } .sub { font-size: 13px; color: var(--mut); margin-top: 2px; }
  .bar { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--accent) 12%, transparent); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; }
  .pill { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 99px; white-space: nowrap; }
  .p-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .p-warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .p-bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .check { width: 24px; height: 24px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 800; flex: none; }
  .tick { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--accent); flex: none; margin-left: 6px; }
  .foot { font-size: 13px; color: var(--mut); padding: 4px 4px 0; }
  .tabs { position: absolute; bottom: 0; left: 0; right: 0; height: 83px; background: color-mix(in srgb, var(--card) 94%, transparent); border-top: .5px solid var(--sep); display: flex; justify-content: center; gap: 0; padding-top: 7px; backdrop-filter: blur(20px); z-index: 5; }
  .tab { display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: 500; color: #8E8A94; gap: 3px; width: 76px; }
  .tab.on { color: var(--accent); } .tab svg { width: 26px; height: 24px; }
  /* form screens */
  .navbar { background: var(--purple); color: #fff; padding: 0 16px 12px; }
  .navbar h1 { font: 700 34px Inter, -apple-system, sans-serif; letter-spacing: .2px; padding-top: 6px; }
  .navbar.inline { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 12px; font-size: 17px; }
  .navbar.inline b { font-weight: 600; } .navbar.inline span { color: #E3D2F7; }
  .form { background: var(--canvas); padding: 18px 16px 120px; min-height: 900px; }
  .fh { font-size: 13px; color: var(--mut); text-transform: uppercase; margin: 0 0 6px 16px; }
  .grp { background: var(--card); border-radius: 12px; margin-bottom: 22px; overflow: hidden; }
  .fr { display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 44px; font-size: 17px; position: relative; }
  .fr + .fr::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
  .ic + .grow, .fr.ico::before { left: 58px !important; }
  .ic { width: 30px; height: 30px; border-radius: 9px; background: var(--yellow); color: #3C175B; display: grid; place-items: center; font-size: 14px; font-weight: 800; flex: none; }
  .val { color: var(--mut); } .chev { color: #C4C4C7; font-size: 20px; }
  .link { color: var(--accent); }
  .stepper { display: flex; border-radius: 8px; background: rgba(118,118,128,.12); font-size: 20px; } .stepper span { width: 47px; text-align: center; padding: 2px 0; } .stepper span + span { border-left: 1px solid var(--sep); }
  .toggle { width: 51px; height: 31px; border-radius: 99px; background: var(--ok); position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; right: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
  .datebtn { background: rgba(118,118,128,.12); padding: 6px 11px; border-radius: 8px; }
  .cap { font-size: 13px; color: var(--mut); margin: -16px 16px 22px; line-height: 1.35; }
  .primary { background: var(--purple); color: #fff; text-align: center; font-weight: 600; font-size: 17px; padding: 15px; border-radius: 14px; }
  .more { margin: 0 0 22px; background: var(--card); border: 1px solid var(--sep); border-radius: 22px; padding: 16px; display: flex; gap: 14px; align-items: center; }
  .more .t { color: #2747E8; font-weight: 600; font-size: 17px; } .dark .more .t { color: #8A9DFF; }
  .more .s { color: var(--mut); font-size: 15px; }
  .more .b { background: #2747E8; color: #fff; font-weight: 700; font-size: 15px; padding: 6px 14px; border-radius: 99px; } .dark .more .b { background: #8A9DFF; color: #0D1018; }
  .appfoot { text-align: center; color: var(--mut); font-size: 15px; padding: 6px 0 24px; } .appfoot img { display: block; margin: 0 auto 14px; width: 64px; height: 64px; border-radius: 14px; }
  .prod { display: flex; gap: 14px; align-items: center; padding: 14px 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
const screen = P.get('s') || 'kit';
const EN = P.get('lang') === 'en';
if (EN) document.documentElement.lang = 'en';
if (P.get('dark') === '1') document.body.classList.add('dark');
const t = (nl, en) => EN ? en : nl;
const { svg, CAT, ITEM_CAT } = NP_ART;
const dark = P.get('dark') === '1';
const tileBg = k => { const c = CAT[ITEM_CAT[k] || 'hygiene']; return dark ? '#2A2532' : `linear-gradient(135deg,${c.a},${c.b})`; };
const tile = (k, s = 56) => `<div class="tile" style="width:${s}px;height:${s}px;border-radius:${s * .26}px;background:${tileBg(k)}">${svg(k)}</div>`;
const status = `<div class="status"><span>9:41</span><i>●●●● ▮</i></div>`;
const I = {
  scan: '<svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>',
};
const tabIcons = {
  kit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
  exp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  shop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4h6v3H9zM8 12h8M8 16h6"/></svg>',
  set: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
};
const tabs = on => `<div class="tabs">${[['kit', t('Pakket', 'Kit')], ['exp', t('Houdbaar', 'Expiry')], ['shop', t('Boodschappen', 'Shopping')], ['plan', t('Noodplan', 'Plan')], ['set', t('Instellingen', 'Settings')]]
  .map(([k, l]) => `<div class="tab ${k === on ? 'on' : ''}">${tabIcons[k]}${l}</div>`).join('')}</div>`;
const heroArt = keys => `<div class="art">
  ${keys[2] ? svg(keys[2], 76).replace('<svg', '<svg style="right:4px;top:0;transform:rotate(5deg)"') : ''}
  ${keys[1] ? svg(keys[1], 100).replace('<svg', '<svg style="right:0;top:96px;transform:rotate(7deg)"') : ''}
  ${svg(keys[0], 88).replace('<svg', '<svg style="right:74px;top:42px;transform:rotate(-8deg)"')}</div>`;
const hero = (title, sub, art, body, btns = []) => `<div class="hero${art ? ' has-art' : ''}">${art ? heroArt(art) : ''}
  <div class="top"><h1>${title}</h1><div class="hbtns">${btns.map(b => `<div class="hbtn">${I[b]}</div>`).join('')}</div></div>
  ${sub ? `<div class="subt">${sub}</div>` : ''}${body || ''}</div>`;
const pill = (cls, txt) => `<span class="pill p-${cls}">${txt}</span>`;
const days = n => n < 0 ? t('Verlopen', 'Expired') : t(`${n} dagen`, `${n} days`);
const dcls = n => n <= 7 ? 'bad' : n <= 30 ? 'warn' : 'ok';
const U = { L: ' L', d: t(' dagen', ' days'), pk: t(' pakken', ' packs'), st: t(' st.', ' pcs') };

// The demo kit: [key, NL name, EN name, have, need, unit, daysLeft|null]
const kit = [
  ['water', 'Drinkwater', 'Drinking water', 27, 27, 'L', 412],
  ['food', 'Houdbaar eten', 'Long-life food', 6, 9, 'd', 188],
  ['medicines', 'Medicijnen', 'Medicines', 1, 1, 'pk', 27],
  ['firstaid', 'EHBO-doos', 'First aid kit', 1, 1, 'st', 741],
  ['flashlight', 'Zaklamp', 'Torch', 1, 1, 'st', null],
  ['batteries', 'Batterijen', 'Batteries', 2, 2, 'pk', 23],
  ['powerbank', 'Powerbank', 'Power bank', 1, 1, 'st', null],
  ['candles', 'Kaarsen en lucifers', 'Candles and matches', 0, 1, 'pk', null],
  ['radio', 'Noodradio', 'Emergency radio', 0, 1, 'st', null],
  ['cash', 'Contant geld', 'Cash', 120, 170, '€', null],
  ['documents', 'Kopie van ID-bewijzen', 'Copies of ID documents', 1, 1, 'st', null],
  ['blankets', 'Dekens en warme kleding', 'Blankets and warm clothes', 3, 3, 'st', null],
  ['hygiene', 'Wc-papier en vuilniszakken', 'Toilet paper and bin bags', 1, 1, 'pk', null],
];
const cats = [['waterFood', 'Water en eten', 'Water and food'], ['health', 'Gezondheid', 'Health'], ['lightPower', 'Licht en stroom', 'Light and power'],
  ['information', 'Informatie', 'Information'], ['documents', 'Geld en documenten', 'Money and documents'], ['warmth', 'Warmte en beschutting', 'Warmth and shelter'], ['hygiene', 'Hygiëne', 'Hygiene']];
const fmt = (v, u) => u === '€' ? `€ ${v}` : `${v}${U[u]}`;
const row = ([k, nl, en, have, need, u, d]) => {
  const full = have >= need;
  const end = d != null ? pill(dcls(d), days(d)) : have === 0 ? pill('bad', t('Ontbreekt', 'Missing')) : full ? '<span class="check">✓</span>' : '';
  return `<div class="row">${tile(k)}<div class="grow"><div class="name">${t(nl, en)}</div><div class="sub">${fmt(have, u)} / ${fmt(need, u)}</div>
    <div class="bar"><i style="width:${Math.max(3, Math.min(100, have / need * 100))}%;background:${full ? 'var(--ok)' : 'var(--yellow)'}${have === 0 ? ';opacity:0' : ''}"></i></div></div>${end}</div>`;
};

const screens = {
  kit: () => `${status}<div class="wrap">${hero(t('Noodpakket', 'Emergency kit'), t('Voor 3 personen · 3 dagen', 'For 3 people · 3 days'), ['water', 'radio', 'food'],
      `<div class="num">85%</div><div class="meterbar"><i style="width:85%"></i></div><div class="togo">${t('Nog 4 te gaan', '4 items to go')}</div>`, ['scan', 'plus'])}
    <div class="sheet">
      <div class="alert">${tile('batteries', 44)}<span>${t('Batterijen: verloopt over 23 dagen.', 'Batteries: expires in 23 days.')}</span><span class="chev">›</span></div>
      <div class="search">⌕ ${t('Zoek in het pakket', 'Search the kit')}</div>
      ${cats.map(([c, nl, en]) => { const r = kit.filter(x => ITEM_CAT[x[0]] === c); return r.length ? `<div class="st">${t(nl, en)}</div>${r.map(row).join('')}` : ''; }).join('')}
    </div></div>${tabs('kit')}`,

  exp: () => {
    const list = [['firstaid', 'Pleisters', 'Plasters', '2 november 2026', 'November 2, 2026', -9], ['batteries', 'Batterijen', 'Batteries', '4 december 2026', 'December 4, 2026', 23],
      ['medicines', 'Medicijnen', 'Medicines', '8 december 2026', 'December 8, 2026', 27], ['food', 'Houdbaar eten', 'Long-life food', '18 mei 2027', 'May 18, 2027', 188],
      ['petfood', 'Dierenvoer', 'Pet food', '1 augustus 2027', 'August 1, 2027', 263], ['water', 'Drinkwater', 'Drinking water', '28 december 2027', 'December 28, 2027', 412]];
    const sec = (title, f) => { const r = list.filter(f); return r.length ? `<div class="st">${title}</div>${r.map(([k, nl, en, dn, de, d]) => `<div class="row">${tile(k, 52)}<div class="grow"><div class="name">${t(nl, en)}</div><div class="sub">${t(dn, de)}</div></div>${pill(dcls(d), days(d))}</div>`).join('')}` : ''; };
    return `${status}<div class="wrap">${hero(t('Houdbaarheid', 'Expiry dates'), t('Vervang spullen voordat ze verlopen', 'Replace things before they expire'), null,
      `<div class="stats"><div><b style="color:#FF8A84">1</b><small>${t('Verlopen', 'Expired')}</small></div><div><b style="color:var(--yellow)">2</b><small>${t('Binnen 30 dagen', 'Within 30 days')}</small></div><div><b>3</b><small>${t('Later', 'Later')}</small></div></div>`)}
      <div class="sheet">${sec(t('Verlopen', 'Expired'), x => x[5] < 0)}${sec(t('Binnen 30 dagen', 'Within 30 days'), x => x[5] >= 0 && x[5] <= 30)}${sec(t('Later', 'Later'), x => x[5] > 30)}</div></div>${tabs('exp')}`;
  },

  shop: () => {
    const list = [['radio', 'Noodradio', 'Emergency radio', t('1 st.', '1 pcs')], ['food', 'Houdbaar eten', 'Long-life food', t('3 dagen', '3 days')],
      ['candles', 'Kaarsen en lucifers', 'Candles and matches', t('1 pakken', '1 packs')], ['cash', 'Contant geld', 'Cash', '€ 50'], ['batteries', 'Batterijen', 'Batteries', t('1 pakken', '1 packs')]];
    return `${status}<div class="wrap">${hero(t('Boodschappen', 'Shopping list'), t('5 dingen te kopen', '5 items to buy'), ['food', 'cash', 'batteries'], '', ['scan', 'share'])}
      <div class="sheet">${list.map(([k, nl, en, q]) => `<div class="row"><span class="tick"></span>${tile(k, 52)}<div class="grow"><div class="name">${t(nl, en)}</div><div class="sub">${t('Nog nodig: ', 'Still needed: ')}${q}</div></div></div>`).join('')}
      <div class="foot">${t('Vink een item af als je het gekocht hebt: het gaat dan je pakket in.', 'Tick an item when you have bought it: it moves into your kit.')}</div></div></div>${tabs('shop')}`;
  },

  scan: () => `${status}<div class="navbar inline"><span>${t('Annuleer', 'Cancel')}</span><b>${t('Scan barcode', 'Scan barcode')}</b><span style="color:var(--yellow);font-weight:600">${t('Voeg toe', 'Add')}</span></div>
    <div class="form" style="background:var(--canvas)"><div class="wrap">
      <div class="grp"><div class="prod">
        <div style="width:96px;height:96px;border-radius:18px;background:#fff;border:1px solid rgba(0,0,0,.06);display:grid;place-items:center;flex:none">${svg('water', 84)}</div>
        <div class="grow"><div class="name" style="font-size:18px">${t('Natuurlijk mineraalwater 6 × 1,5 L', 'Natural mineral water 6 × 1.5 L')}</div><div class="sub" style="font-size:15px">${t('Huismerk', 'Store brand')}</div><div class="sub">8712345678906</div></div></div></div>
      <div class="cap">${t('Productgegevens: Open Food Facts (ODbL)', 'Product data: Open Food Facts (ODbL)')}</div>
      <div class="fh">${t('Toevoegen aan', 'Add to')}</div><div class="grp">
        <div class="fr"><span class="grow">${t('Item', 'Item')}</span><span class="link">${t('Drinkwater', 'Drinking water')} ⌄</span></div>
        <div class="fr"><span class="grow">${t('Hoeveelheid', 'Amount')}</span><span class="val">9 L</span><div class="stepper"><span>−</span><span>+</span></div></div>
        <div class="fr"><span class="grow">${t('Na toevoegen', 'After adding')}</span><span class="val">27 L / 27 L</span></div></div>
      <div class="fh">${t('Houdbaarheidsdatum', 'Expiry date')}</div><div class="grp">
        <div class="fr"><span class="grow">${t('Heeft een houdbaarheidsdatum', 'Has an expiry date')}</span><div class="toggle"></div></div>
        <div class="fr"><span class="grow">${t('Verloopt op', 'Expires on')}</span><span class="datebtn">${t('14 jan 2028', 'Jan 14, 2028')}</span></div>
        <div class="fr link">⌗ ${t('Scan datum van verpakking', 'Scan date from packaging')}</div></div>
      <div class="primary">${t('Voeg toe', 'Add')}</div></div></div>`,

  plan: () => `${status}<div class="navbar"><h1>${t('Noodplan', 'Emergency plan')}</h1></div>
    <div class="form"><div class="wrap">
      <div class="fh">${t('Wat te doen bij…', 'What to do when…')}</div><div class="grp">
        ${[['!', 'NL-Alert of sirene', 'NL-Alert or siren'], ['⚡', 'Stroomuitval', 'Power cut'], ['💧', 'Geen kraanwater', 'No tap water'], ['☁', 'Storm, noodweer of overstroming', 'Storm, extreme weather or flooding']]
          .map(([i, nl, en]) => `<div class="fr"><span class="ic">${i}</span><span class="grow">${t(nl, en)}</span><span class="chev">›</span></div>`).join('')}</div>
      <div class="grp"><div class="fr" style="font-size:15px;color:var(--mut)">${t('Spreek dit samen af en bewaar een geprinte versie bij je noodpakket. In een noodsituatie werkt je telefoon misschien niet.', 'Agree on this together and keep a printed copy with your kit. Phones may not work during an emergency.')}</div></div>
      <div class="fh">${t('Verzamelpunt', 'Meeting point')}</div><div class="grp"><div class="fr">${t('Bij de buren op nummer 12, anders het buurthuis', 'The neighbours at number 12, otherwise the community centre')}</div></div>
      <div class="fh">${t('Contacten', 'Contacts')}</div><div class="grp"><div class="fr">Sanne 06-12345678<br>${t('Opa en oma', 'Grandma and grandpa')} 055-1234567</div></div>
