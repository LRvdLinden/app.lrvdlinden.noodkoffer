<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="/homey.js" data-origin="settings"></script>
  <style>
    :root {
      --accent: #2747E8; --ink: #121726; --muted: #5D6578; --surface: #FFFFFF; --line: #DDE2EC;
      --green: #1B9A5E; --amber: #C77A00; --red: #D33A3F;
    }
    @media (prefers-color-scheme: dark) {
      :root { --accent: #8A9DFF; --ink: #E9ECF4; --muted: #98A0B3; --surface: #161B27; --line: #262D3D; --green: #3CCB86; --amber: #F5B731; --red: #FF6B6F; }
    }
    body { font-family: -apple-system, system-ui, sans-serif; color: var(--ink); margin: 0; padding: 16px; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 16px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 0 0 12px; }
    .code { font: 700 34px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .18em; margin: 4px 0 12px; }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
    .row:first-of-type { border-top: 0; }
    .row span:last-child { text-align: end; font-weight: 600; }
    button.secondary { font: inherit; font-weight: 600; color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
    label.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; }
    .good { color: var(--green); } .warn { color: var(--amber); } .bad { color: var(--red); }

    .section { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 24px 4px 8px; }
    .more { display: flex; align-items: center; gap: 14px; width: 100%; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; cursor: pointer; font: inherit; color: inherit; }
    .more:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .more svg { flex: none; border-radius: 13px; border: 1px solid var(--line); }
    .more .t { font-weight: 600; color: var(--accent); font-size: 16px; }
    .more .s { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .more .txt { flex: 1; min-width: 0; }
    .pill { background: var(--accent); color: var(--surface); font-weight: 700; font-size: 14px; padding: 6px 14px; border-radius: 999px; }
    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 28px 0 12px; }
    footer svg { display: block; margin: 0 auto 10px; border-radius: 14px; }
    footer div { margin-top: 2px; }
  </style>
</head>
<body>
  <h1 data-i18n="settings.title"></h1>

  <div class="card">
    <div class="label" data-i18n="settings.code"></div>
    <div class="code" id="code">······</div>
    <p data-i18n="settings.intro"></p>
    <p id="address"></p>
    <button class="secondary" id="regen" data-i18n="settings.regenerate"></button>
  </div>

  <div class="card" id="status">
    <div class="label" data-i18n="settings.status"></div>
    <div class="row"><span data-i18n="settings.last_sync"></span><span id="lastSync">–</span></div>
    <div class="row"><span data-i18n="settings.items"></span><span id="items">–</span></div>
    <div class="row"><span data-i18n="widget.complete"></span><span id="completeness">–</span></div>
    <div class="row"><span data-i18n="widget.next"></span><span id="next">–</span></div>
  </div>

  <div class="card">
    <label class="toggle"><span data-i18n="settings.notifications"></span><input type="checkbox" id="notifications"></label>
  </div>

  <div class="section" data-i18n="more_apps.section"></div>
  <button class="more" id="moreApps" type="button">
    <svg width="56" height="56" viewBox="0 0 512 512" aria-hidden="true">
      <rect width="512" height="512" rx="116" fill="#121726"/>
      <path d="M132 146v224h100M292 370V146h48a62 62 0 0 1 0 124h-48M338 270l52 100" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="404" cy="126" r="34" fill="#4C6BFF" stroke="#121726" stroke-width="14"/>
    </svg>
    <span class="txt"><div class="t" data-i18n="more_apps.title"></div><div class="s" data-i18n="more_apps.subtitle"></div></span>
    <span class="pill" data-i18n="more_apps.action"></span>
  </button>

  <footer>
    <svg width="64" height="64" viewBox="0 0 1024 1024" aria-hidden="true">
      <defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2FB673"/><stop offset="1" stop-color="#0F7A4A"/></linearGradient></defs>
      <rect width="1024" height="1024" fill="url(#fg)"/>
      <path d="M512 196l280 100v220c0 170-118 290-280 340-162-50-280-170-280-340V296z" fill="#fff"/>
      <path d="M372 432h120l-86 210" fill="none" stroke="#0F7A4A" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M548 470a50 50 0 0 1 100 0c0 50-100 100-110 172h120" fill="none" stroke="#0F7A4A" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div id="version"></div>
    <div id="copyright"></div>
  </footer>

  <script>
    function onHomeyReady(Homey) {
      var lang = (Homey.getLanguage && Homey.getLanguage()) || 'en';
      if (lang === 'ar') document.documentElement.setAttribute('dir', 'rtl');
      document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = Homey.__(el.getAttribute('data-i18n')); });
      var more = document.getElementById('moreApps');
      more.setAttribute('aria-label', Homey.__('more_apps.a11y'));
      more.addEventListener('click', function () { Homey.openURL('https://lrvdlinden.app'); });
      document.getElementById('copyright').textContent = '© ' + new Date().getFullYear() + ' Noodkoffer';

      function fmt(iso) {
        try { return new Date(iso).toLocaleString(lang); } catch (e) { return iso; }
      }

      function render(s) {
        document.getElementById('code').textContent = s.code || '······';
        document.getElementById('version').textContent = Homey.__('footer.version') + ': ' + s.version;
        document.getElementById('address').textContent = s.address ? 'Homey: ' + s.address : '';
        document.getElementById('notifications').checked = s.notifications;
        document.getElementById('lastSync').textContent = s.lastSync ? fmt(s.lastSync) : Homey.__('settings.never');
        document.getElementById('items').textContent = s.linked ? s.itemCount : '–';
        var c = document.getElementById('completeness');
        c.textContent = s.linked ? s.completeness + '%' : '–';
        c.className = !s.linked ? '' : (s.completeness === 100 ? 'good' : (s.completeness >= 60 ? 'warn' : 'bad'));
        document.getElementById('next').textContent = s.next
          ? s.next.name + ' · ' + Homey.__('widget.days', { days: s.next.daysLeft })
          : (s.linked ? Homey.__('widget.all_good') : '–');
      }

      function load() {
        Homey.api('GET', '/status', null, function (err, s) { if (!err && s) render(s); });
      }

      document.getElementById('regen').addEventListener('click', function () {
        Homey.api('POST', '/code', null, function (err, r) { if (!err && r) document.getElementById('code').textContent = r.code; });
      });
      document.getElementById('notifications').addEventListener('change', function (e) {
        Homey.api('PUT', '/settings', { notifications: e.target.checked }, function () {});
      });
      Homey.on('kit-updated', load);

      load();
      Homey.ready();
    }
  </script>
</body>
</html>
